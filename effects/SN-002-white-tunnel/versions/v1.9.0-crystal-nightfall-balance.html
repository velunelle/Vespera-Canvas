      const s=Math.max(.35,Math.min(2,size*.22));

        const grd=c.createRadialGradient(x,y,0,x,y,Math.min(13,size*1.65));
        grd.addColorStop(0,`rgba(214,214,214,${(a*.16).toFixed(3)})`);
        grd.addColorStop(1,'rgba(154,154,154,0)');c.fillStyle=grd;
        c.beginPath();c.arc(x,y,Math.min(13,size*1.65),0,TAU);c.fill();
      }
      c.globalAlpha=clamp(a,.05,.82);c.fillStyle='#e0e0e0';c.beginPath();c.arc(x,y,s,0,TAU);c.fill();
    }
    c.globalAlpha=1;c.globalCompositeOperation='source-over';
  }
  function drawFlakes(){
    const atlas=assets['snowflakes-atlas.webp'];if(!atlas)return;
    c.globalCompositeOperation='source-over';
    const particles=flakes.map(p=>({p,pt:project(p)})).sort((a,b)=>b.p.z-a.p.z);
    for(const {p,pt} of particles){
      const size=clamp(p.radius*6.1/p.z,.8,220);
      if(pt.x<-size*.65||pt.y<-size*.65||pt.x>W+size*.65||pt.y>H+size*.65)continue;
      const alpha=p.alpha*clamp(1.03-p.z*.085,.20,.86);
      c.save();c.globalAlpha=clamp(alpha*1.11,.06,.96);
      c.translate(pt.x,pt.y);c.rotate(p.angle);
      c.shadowBlur=1.05;c.shadowColor='rgba(216,222,228,.27)';
      c.shadowOffsetX=.55;c.shadowOffsetY=.65;
      // Keep crystalline branches sharp at all focal depths; no blur filter.
      const col=p.sprite%4,row=(p.sprite/4)|0;
      // Detailed high-resolution derivative sprite; near camera stays sharp.
      c.drawImage(atlas,col*768,row*768,768,768,-size/2,-size/2,size,size);
      c.shadowBlur=0;c.shadowOffsetX=0;c.shadowOffsetY=0;
      if(p.z<1.45 && p.sprite%11===0){
        const h=clamp(size*.07,1.4,4.2);
        c.globalAlpha=clamp(alpha*.34,0,.25);
        c.strokeStyle='#f8f9f9';c.lineWidth=.5;
        c.beginPath();c.moveTo(-h,0);c.lineTo(h,0);c.moveTo(0,-h);c.lineTo(0,h);c.stroke();
      }
      c.restore();
    }
    c.globalCompositeOperation='source-over';
  }
  function render(t){
    if(stopped)return;
    const dt=last?Math.min((t-last)/1000,.05):0;last=t;
    if(!document.hidden && !prefersReducedMotion)fly(dt);
    c.globalAlpha=1;c.globalCompositeOperation='source-over';c.filter='none';c.clearRect(0,0,W,H);
    drawSky(dt);
    drawFog();c.filter='none';drawDots();drawFlakes();
    requestAnimationFrame(render);
  }
  Promise.all(['snowflakes-atlas.webp','fog-layer-1.png','fog-layer-2.png'].map(loadImage))
    .then(()=>{document.documentElement.dataset.ready='true';resize();requestAnimationFrame(render)})
    .catch(err=>{console.error(err);document.documentElement.dataset.ready='error';});
  addEventListener('resize',resize,{passive:true});
  addEventListener('orientationchange',resize,{passive:true});
  document.addEventListener('visibilitychange',()=>{last=0;});
})();

</script></body></html>

    return groups.filter(p=>{
      if(!p.hero || opacity(p)<.34)return false;
      const pt=project(p),size=p.diameter/p.z;
      return size>=102 && pt.x>size*.16 && pt.x<W-size*.16 &&
        pt.y>size*.16 && pt.y<H-size*.16;
    }).length;
  }
  function advance(dt){
    elapsed+=dt;
    const cycle=Math.floor((elapsed+.80)/14);
    if(cycle>heroCycle)cueCloseup(cycle);
    const closeups=visibleCloseups();visibleHeroLast=closeups;
    // v1.0 drives all depth movement; choreographed close-ups are visual events,
    // not independent modifiers of the physical speed.
    const v=velocity(elapsed);speedNow=v;
    for(let i=0;i<groups.length;i++){
      let p=groups[i],cfg=SETTINGS[p.layer];
      p.z-=dt*v;
      // Keep v1.3 perspective motion; a small drift is purely secondary.
      p.x+=dt*.003*Math.sin(elapsed*.36+p.phase);
      p.y+=dt*.002*Math.sin(elapsed*.24+p.phase2);
      p.angle+=p.spin*dt*.19;
      const screen=project(p),rad=clamp(p.diameter/p.z,5,200)*.53;
      if(p.z<cfg.minZ || (p.z<cfg.maxZ-.18 &&
          (screen.x<-rad||screen.x>W+rad||screen.y<-rad||screen.y>H+rad))){
        groups[i]=newFlake(p.layer,true);
      }
    }
    for(let i=0;i<dust.length;i++){
      let p=dust[i];p.z-=dt*v*p.speed*.7;
      if(p.z<.7){p.z=6.1;p.x=rand(-.8,.8);p.y=rand(-.65,.65)}
    }
    for(const p of flurry){
      p.z-=dt*v*p.speed*.95;
      p.x+=dt*.003*Math.sin(elapsed*.38+p.phase);
      p.y+=dt*.002*Math.cos(elapsed*.30+p.phase);
      if(p.z<.6){p.z=6.2+rand(0,.7);p.x=rand(-.86,.86)*p.z;p.y=rand(-.82,.82)*p.z;}
    }
  }
  function drawSky(dt){
    sky.clearRect(0,0,W,H);sky.globalCompositeOperation='source-over';sky.fillStyle='#e8edf2';
    // Faint fixed distant stars, never enough to look like a static starfield effect.
    for(const p of stars){sky.globalAlpha=p.a*.72;sky.beginPath();sky.arc(p.x,p.y,p.r,0,TAU);sky.fill()}
    // Tiny white snow points travel toward the viewer, not vertically down-screen.
    sky.fillStyle='#f8fafc';
    for(const p of flurry){
      const q=project(p);if(q.x<-5||q.x>W+5||q.y<-5||q.y>H+5)continue;
      const scale=clamp(3.1/p.z,.52,2.4);
      const fade=clamp((6.8-p.z)/1.0,.08,1);
      sky.globalAlpha=p.a*fade;
      sky.beginPath();sky.arc(q.x,q.y,clamp(p.r*scale,.55,2.65),0,TAU);sky.fill();
    }
    sky.globalAlpha=1;
  }
  function opacity(p){
    const c=SETTINGS[p.layer];
    // Fade in at the back and fade away near the lens, so recycled flakes don't pop.
    const appear=1-smooth(c.maxZ-.26,c.maxZ,p.z);
    const exit=smooth(c.minZ,c.minZ+.20,p.z);
    const cueFade=p.hero?smooth(0,.76,elapsed-p.born):1;
    return p.alpha*clamp(appear*exit,0,1)*(p.layer==='far'?.80:1)*cueFade;
  }
  function paint(){
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#dce5eb';
    for(const p of dust){const q=project(p);if(q.x<-5||q.x>W+5||q.y<-5||q.y>H+5)continue;
      ctx.globalAlpha=p.a*.58;ctx.beginPath();ctx.arc(q.x,q.y,clamp(p.r*2.0/p.z,.27,1.8),0,TAU);ctx.fill()}
    ctx.globalAlpha=1;
    if(!atlas.complete||!atlas.naturalWidth)return;
    const ordered=groups.slice().sort((a,b)=>b.z-a.z);
    for(const p of ordered){
      const q=project(p),size=clamp(p.diameter/p.z,3,194),a=opacity(p);
      if(a<.012||q.x<-size*.6||q.x>W+size*.6||q.y<-size*.6||q.y>H+size*.6)continue;
      ctx.save();ctx.translate(q.x,q.y);ctx.rotate(p.angle);
      if(p.roll){const theta=elapsed*p.rollRate+p.rollPhase;
        const tilt=.59+.41*Math.abs(Math.cos(theta));
        ctx.transform(tilt,.09*Math.sin(theta*.63+p.phase),.055*Math.sin(theta),1,0,0);
      }
      ctx.globalAlpha=a;
      // Atlas contains transparent RGB faceting; preserve the 3D crystalline edges rather than blur.
      ctx.drawImage(atlas,(p.sprite%4)*256,Math.floor(p.sprite/4)*256,256,256,-size*.5,-size*.5,size,size);
      if(p.layer==='near'&&p.specular&&p.z<1.13){
        ctx.globalAlpha=a*.12;ctx.globalCompositeOperation='screen';
        ctx.drawImage(atlas,(p.sprite%4)*256,Math.floor(p.sprite/4)*256,256,256,-size*.5-.45,-size*.5-.30,size+1,size+1);
      }
      ctx.restore();
    }
    // The v1.0 hero animation was a dedicated scene beat on top of 3D particles.
    // Restore the fade, location, growing size and timing with the v2.3 ice atlas.
    const period=elapsed%14,hero=heroAlpha(elapsed);
    if(hero>.005 && atlas.complete && atlas.naturalWidth){
      const size=lerp(115,330,smooth(1.8,5.2,period))*Math.min(1.2,W/950);
      const x=W*.50+Math.sin(period*.51)*W*.035;
      const y=H*.46+Math.sin(period*.4)*H*.055;
      ctx.save();ctx.translate(x,y);ctx.rotate(period*.033);
      ctx.globalAlpha=hero*.94;
      ctx.drawImage(atlas,(6%4)*256,Math.floor(6/4)*256,256,256,-size*.5,-size*.5,size,size);
      ctx.restore();
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }
  function frame(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;
    const hidden=document.hidden,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!hidden&&!reduced)advance(dt);
    drawSky(hidden||reduced?0:dt);paint();requestAnimationFrame(frame);
  }
  resize();addEventListener('resize',resize,{passive:true});
  document.addEventListener('visibilitychange',()=>{last=0});requestAnimationFrame(frame);
  window.SN002_DEBUG={settings:SETTINGS,velocity:()=>speedNow,baselineVelocity:()=>velocity(elapsed),
    advanceSeconds:(n)=>{for(let k=0;k<Math.round(n*60);k++)advance(1/60);drawSky(0);paint()},stats:()=>{
    const visible={near:0,mid:0,far:0},sizes={near:[],mid:[],far:[]};
    for(const p of groups){const q=project(p),size=clamp(p.diameter/p.z,3,194);
      if(q.x<0||q.x>W||q.y<0||q.y>H||opacity(p)<.1)continue;
      visible[p.layer]++;sizes[p.layer].push(Math.round(size));}
    return{elapsed:Math.round(elapsed*10)/10,velocity:speedNow,baseline:velocity(elapsed),
      closeups:visibleCloseups(),heroAlpha:heroAlpha(elapsed),heroCycle,visible,sizes,
      stars:stars.length,forwardSpecks:flurry.length,DPR}}
  };
})();
</script>

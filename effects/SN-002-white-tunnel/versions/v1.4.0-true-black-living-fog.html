    const img=new Image();img.decoding='async';img.onload=()=>{assets[name]=img;resolve(img)};img.onerror=()=>reject(new Error('Asset could not load: '+name));img.src=EMBEDDED_ASSETS[name];
  })}
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const smooth=(a,b,x)=>{const q=clamp((x-a)/(b-a),0,1);return q*q*(3-2*q)};
  let seed=20261108;
  const rand=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296};
  const TAU=Math.PI*2;
  let W=1,H=1,DPR=1,last=0,elapsed=0,flakes=[],dust=[],running=true;
  let stopped=false;
  const prefersReducedMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  function create(kind,far=false){
    const z=far?5.15+rand()*.35:lerp(.27,5.2,Math.pow(rand(),.67));
    return {kind,z,x:(rand()-.5)*3.4,y:(rand()-.5)*2.1,
      radius:kind==='dot'?lerp(.65,2.8,rand()):lerp(8,29,Math.pow(rand(),1.3)),
      angle:rand()*TAU,spin:(rand()-.5)*1.2,sprite:Math.floor(rand()*16),alpha:lerp(.70,1,rand()),twinkle:rand()*TAU};
  }
  function populate(){
    const area=W*H;
    flakes=Array.from({length:Math.round(clamp(area/2300,145,205))},()=>create('flake'));
    dust=Array.from({length:Math.round(clamp(area/1100,300,490))},()=>create('dot'));
  }
  function resize(){
    const rect=canvas.getBoundingClientRect();const w=Math.max(1,Math.round(rect.width)),h=Math.max(1,Math.round(rect.height));
    if(W===w&&H===h)return;
    W=w;H=h;
    DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    c.setTransform(DPR,0,0,DPR,0,0);
    c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
    if(!flakes.length)populate();
  }
  const project=p=>({x:W/2+p.x*(W*.58)/p.z,y:H/2+p.y*(H*.97)/p.z});
  function fly(dt){
    elapsed+=dt;
    const speed=.22 + smooth(3.4,7.5,elapsed%14)*.40;
    // Intentionally same progression and projection as SN-002-M.
    for(const p of flakes){p.z-=dt*speed;p.angle+=p.spin*dt*.19;
      if(p.z<.13){p.z=5.15+rand()*.35;p.x=(rand()-.5)*3.4;p.y=(rand()-.5)*2.1;}}
    for(const p of dust){p.z-=dt*speed*.84;p.angle+=p.spin*dt*.19;
      if(p.z<.13){p.z=5.15+rand()*.35;p.x=(rand()-.5)*3.4;p.y=(rand()-.5)*2.1;}}
  }
  // REAL animated vapour field, not an image or a moving static texture.
  // Recalculate a low-resolution evolving flow/noise field at ~12 fps.
  // Each point changes shape and density over time via domain-warped fBm.
  const fogCanvas=document.createElement('canvas');
  const fogContext=fogCanvas.getContext('2d',{alpha:true,willReadFrequently:false});
  let fogW=0,fogH=0,lastFogAt=-1,fogFrames=0;
  function hash2(x,y){
    let n=Math.imul(x,374761393)+Math.imul(y,668265263);
    n=(n^(n>>>13));n=Math.imul(n,1274126177);
    return ((n^(n>>>16))>>>0)/4294967295;
  }
  function noise2(x,y){
    const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
    const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
    const a=hash2(ix,iy),b=hash2(ix+1,iy),d=hash2(ix,iy+1),e=hash2(ix+1,iy+1);
    return lerp(lerp(a,b,sx),lerp(d,e,sx),sy);
  }
  function updateFog(time){
    const fw=Math.round(clamp(W*.33,108,172)),fh=Math.round(fw*H/W);
    if(fw!==fogW||fh!==fogH){fogW=fw;fogH=fh;fogCanvas.width=fw;fogCanvas.height=fh;}
    const image=fogContext.createImageData(fogW,fogH);
    const out=image.data;
    // The smoke has multiple independent flows, so it billows and changes shape.
    const t=time*.14;
    for(let y=0;y<fogH;y++){
      const v=y/fogH;
      for(let x=0;x<fogW;x++){
        const u=x/fogW;
        const flowX=noise2(u*2.9+t*.052,v*2.5-t*.035)-.5;
        const flowY=noise2(u*2.5-t*.022+17,v*2.8+t*.042)-.5;
        const ax=u+flowX*.24+t*.012;
        const ay=v+flowY*.18-t*.007;
        const large=noise2(ax*2.7+4.1,ay*3.7+1.1);
        const med=noise2(ax*6.4+1.5,ay*6.6+3.2);
        const fine=noise2(ax*13.8+1.2,ay*11.6+7.5);
        const detail=noise2(ax*26.7+7.4,ay*19.8+9.2);
        // Curling fine smoke strands embedded inside soft billows.
        const spine=Math.sin((ay-.66*ax)*19+(large-.5)*8+(med-.5)*2.7);
        const filament=smooth(.59,.94,spine)*smooth(.28,.72,large)*(.62+.38*med);
        const veil=smooth(.40,.70,large*.64+med*.24+fine*.12);
        // Dark, negative space in the center; fog wisps mainly at the periphery.
        const left=Math.exp(-Math.pow((u-.03)/.36,2)-Math.pow((v-.48)/.76,2));
        const right=Math.exp(-Math.pow((u-1.05)/.44,2)-Math.pow((v-.49)/.72,2));
        const edge=(.09+.54*left+.58*right+.13*Math.pow(Math.abs(v-.5)*2,2));
        const body=Math.max(0,veil*.65+filament*.53-.15);
        const density=body*edge*(.77+.23*detail);
        const alpha= Math.round(Math.min(66,Math.max(0,density*87)));
        const i=(y*fogW+x)*4;
        out[i]=168;out[i+1]=168;out[i+2]=168;out[i+3]=alpha;
      }
    }
    fogContext.putImageData(image,0,0);
    lastFogAt=time;fogFrames++;
  }
  function drawFog(){
    // The base remains true #000000; fog is a separately alpha-composited
    // grayscale volume, not a blue gradient or image sliding across the page.
    if(!fogW || elapsed-lastFogAt > .082 || lastFogAt<0)updateFog(elapsed);
    c.save();c.globalCompositeOperation='screen';c.globalAlpha=.83;
    c.drawImage(fogCanvas,0,0,W,H);
    c.restore();
  }
  window.__snowV14Diagnostics=()=>({fogFrames,fogW,fogH,flakes:flakes.length,dust:dust.length,elapsed,background:getComputedStyle(document.querySelector('#world')).backgroundColor});
  function drawDots(){
    c.globalCompositeOperation='screen';
    for(const p of dust){
      const {x,y}=project(p);if(x<-18||x>W+18||y<-18||y>H+18)continue;
      const size=clamp(p.radius*4.7/p.z,.25,11);
      const a=p.alpha*clamp((5.75-p.z)/2.5,.28,.84);
      const s=Math.max(.35,Math.min(2,size*.22));
      if(size>3){
        const grd=c.createRadialGradient(x,y,0,x,y,Math.min(13,size*1.65));
        grd.addColorStop(0,`rgba(210,230,248,${(a*.25).toFixed(3)})`);
        grd.addColorStop(1,'rgba(154,202,239,0)');c.fillStyle=grd;
        c.beginPath();c.arc(x,y,Math.min(13,size*1.65),0,TAU);c.fill();
      }
      c.globalAlpha=clamp(a,.05,.82);c.fillStyle='#d8e8f9';c.beginPath();c.arc(x,y,s,0,TAU);c.fill();
    }
    c.globalAlpha=1;c.globalCompositeOperation='source-over';
  }
  function drawFlakes(){
    const atlas=assets['snowflakes-atlas.webp'];if(!atlas)return;
    c.globalCompositeOperation='screen';
    const particles=flakes.map(p=>({p,pt:project(p)})).sort((a,b)=>b.p.z-a.p.z);
    for(const {p,pt} of particles){
      const size=clamp(p.radius*6.1/p.z,.8,192);
      if(pt.x<-size*.65||pt.y<-size*.65||pt.x>W+size*.65||pt.y>H+size*.65)continue;
      const alpha=p.alpha*clamp(1.03-p.z*.085,.20,.86);
      c.save();c.globalAlpha=clamp(alpha*1.04,.03,1);c.translate(pt.x,pt.y);c.rotate(p.angle);
      // Keep crystalline branches sharp at all focal depths; no blur filter.
      const col=p.sprite%4,row=(p.sprite/4)|0;
      c.drawImage(atlas,col*192,row*192,192,192,-size/2,-size/2,size,size);
      c.restore();
    }
    c.globalCompositeOperation='source-over';
  }
  function render(t){
    if(stopped)return;
    const dt=last?Math.min((t-last)/1000,.05):0;last=t;
    if(!document.hidden && !prefersReducedMotion)fly(dt);
    c.clearRect(0,0,W,H);
    drawFog();drawDots();drawFlakes();
    requestAnimationFrame(render);
  }
  Promise.all(['snowflakes-atlas.webp'].map(loadImage))
    .then(()=>{document.documentElement.dataset.ready='true';resize();requestAnimationFrame(render)})
    .catch(err=>{console.error(err);document.documentElement.dataset.ready='error';});
  addEventListener('resize',resize,{passive:true});
  addEventListener('orientationchange',resize,{passive:true});
  document.addEventListener('visibilitychange',()=>{last=0;});
})();

</script></body></html>

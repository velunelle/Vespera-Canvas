<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SN-002 · 全版本对照</title><meta name="theme-color" content="#111313"><style>
:root{color-scheme:dark;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d1010;color:#edece8;font-size:14px}main{max-width:780px;margin:0 auto;padding:26px 16px 90px}
small{color:#aab7bb}h1{font-size:29px;margin:10px 0 12px;line-height:1.2}p{color:#afbbbe;line-height:1.7}header{padding-bottom:16px;border-bottom:1px solid #30383b}
section{background:#171c1e;border:1px solid #323c40;margin:10px 0;border-radius:12px;padding:15px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ver{font-weight:700;font-size:13px;color:#bbced3}.name{font-size:17px;font-weight:600;margin-top:4px}.desc{color:#9dabb0;font-size:12px;margin-top:4px}
.action{display:flex;gap:10px;margin-top:13px}a{background:#e1e8e9;color:#13191a;text-decoration:none;padding:11px;text-align:center;border-radius:8px;flex:1;font-weight:700}
select,textarea,button{font:inherit;border:1px solid #455459;border-radius:8px;background:#222c30;color:#ecf0ef}select{padding:8px;width:120px}
textarea{display:block;width:100%;margin-top:10px;padding:10px;resize:vertical;min-height:53px}
button{cursor:pointer;padding:12px}.footer{position:sticky;bottom:0;display:flex;gap:9px;background:#0d1010eb;padding:12px 0;border-top:1px solid #374045}.footer button:first-child{background:#dfe8e8;color:#111819;flex:1;font-weight:700}
.note{border:1px solid #344044;background:#131a1c;padding:12px;border-radius:9px;font-size:12px}
</style></head><body><main><header><small>VESPERA CANVAS / SN-002</small><h1>雪晶穿梭 · 全版本对照</h1><p>包含目前保留的 11 个版本。打开各版观看后，选择保留、待优化或建议删除，并在下面写批注。评价自动保存在当前浏览器，可以复制带回聊天。</p><p class="note">建议重点比较 v1.0、v1.3、v1.5、v2.2 和 v2.3；早期 v1.1、v1.2 仅作历史对照。请观察一个完整节奏周期，特别是慢动作时的大冰晶位置。</p></header>
<div id="items"></div><p><small>本页只提供比较和收集批注，不表示任何版本已通过最终验收。正式可复用模块将在选定版本后拆分整理。</small></p>
<div class="footer"><button id="copy">复制已填写的批注</button><button id="clear">清空批注</button></div></main><script>
const versions=[["v1.0","v1.0.0-original.html","动效节奏依然最好；雪花和背景较粗糙"],["v1.1","v1.1.0-cold-fog.html","雪花仍粗糙；毛玻璃感背景有进步；节奏不及 v1，雪花偏稀"],["v1.3","v1.3.0-dark-mist-crisp.html","雪花、布局、背景均有问题；动效不及 v1，和 v1.1 差不多；偏稀"],["v1.4","v1.4.0-true-black-living-fog.html","背景一般；雪花薄如纸，透明度存在明显问题；动效尚可"],["v2.2","v2.2.0-v13-rhythm-visible-snow.html","节奏和雪花布局有问题；小雪点往下落而未向前飞；整体勉强可保留"],["v2.3","v2.3.0-slow-motion-closeup.html","只有贴脸冰晶的单帧做得好；布局与雪点运动方向仍有 v2.2 的问题"],["v2.4","v2.4.0-v1-cinema-forward-snow.html","新试验版：恢复 v1 速度与主镜头动画，小雪点改为向前穿梭；未获用户验收"],["v2.5","v2.5.0-slow-closeups-fuller-field.html","保留 v2.4，慢镜头前方持续有三片近景冰晶，远景略增；待审美验收"],["v2.6","v2.6.0-continuous-3d-flythrough.html","连续三维穿行：3片冰晶先从远处靠近，在慢段到镜头前自然放大并倾斜；保留v2.4背景和后期材质（待验收）"],["v2.7","v2.7.0-crystal-passage.html","雪量仍少，快镜缺少穿梭感，冰晶旋转太多"],["v2.8","v2.8.0-snow-tunnel.html","快镜中雪粒从深处向四周掠过，大多数冰晶以正面姿态靠近"]];
versions.push(["v2.9","v2.9.0-immersive-corridor.html","候选：全屏分布、两次明显快穿梭、近景连续掠过、半透明微光雪点；尚待用户验收"]);\nconst root=document.getElementById('items');
let state={};try{state=JSON.parse(localStorage.getItem('sn002-versions-review-20261108')||'{}')}catch(e){}
function save(){const out={};document.querySelectorAll('section[data-v]').forEach(el=>{out[el.dataset.v]={value:el.querySelector('select').value,text:el.querySelector('textarea').value}});try{localStorage.setItem('sn002-versions-review-20261108',JSON.stringify(out))}catch(e){}}
for(const [version,filename,description] of versions){
 const el=document.createElement('section');el.dataset.v=version;
 const top=document.createElement('div');top.className='top';const heading=document.createElement('div');
 for(const [cls,text] of [['ver',version],['name',version+' · 动态预览'],['desc',description]]){const d=document.createElement('div');d.className=cls;d.textContent=text;heading.append(d)}top.append(heading);el.append(top);
 const action=document.createElement('div');action.className='action';const a=document.createElement('a');a.href='/'+filename;a.target='_blank';a.rel='noopener';a.textContent='打开 '+version;action.append(a);
 const select=document.createElement('select');select.setAttribute('aria-label',version+' 选择');for(const [key,label] of [['unsure','待比较'],['keep','保留'],['improve','待优化'],['delete','建议删除']]){const op=document.createElement('option');op.value=key;op.textContent=label;select.append(op)}select.value=state[version]?.value||'unsure';select.onchange=save;action.append(select);el.append(action);
 const textarea=document.createElement('textarea');textarea.placeholder='这里写节奏、密度、材质、背景等批注';textarea.setAttribute('aria-label',version+' 批注');textarea.value=state[version]?.text||'';textarea.oninput=save;el.append(textarea);root.append(el);
}
document.getElementById('copy').onclick=async()=>{
 const lines=['SN-002 用户版本批注'];let n=0;
 for(const el of root.querySelectorAll('section[data-v]')){const sel=el.querySelector('select'),note=el.querySelector('textarea').value.trim();if(sel.value==='unsure'&&!note)continue;n++;lines.push(el.dataset.v+'｜'+sel.options[sel.selectedIndex].text+(note?'｜'+note:''))}
 if(!n)lines.push('尚未填写内容');const value=lines.join('\n');try{await navigator.clipboard.writeText(value);document.getElementById('copy').textContent='已复制，返回聊天粘贴即可'}catch(e){window.prompt('请复制批注',value)}
};
document.getElementById('clear').onclick=()=>{if(!confirm('确定清空全部批注？'))return;try{localStorage.removeItem('sn002-versions-review-20261108')}catch(e){}location.reload()};
</script></body></html>

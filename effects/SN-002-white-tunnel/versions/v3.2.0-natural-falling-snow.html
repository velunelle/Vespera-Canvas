// These are genuine independently simulated snow crystals, not a timed animated overlay.

let fallingId=0;
function makeFalling(recycle=false){

function makeSpeck(i,recycle=false){const cols=16,rows=20,cell=(i*137)%(cols*rows),u=(cell%cols+random(.05,.95))/cols,v=(Math.floor(cell/cols)+random(.05,.95))/rows;

const sparkle=document.createElement('canvas');sparkle.width=sparkle.height=64;const sc=sparkle.getContext('2d');
const gr=sc.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(245,250,255,.78)');gr.addColorStop(.07,'rgba(237,246,255,.60)');gr.addColorStop(.23,'rgba(221,232,248,.23)');gr.addColorStop(.53,'rgba(206,225,241,.065)');gr.addColorStop(1,'rgba(194,214,228,0)');sc.fillStyle=gr;sc.fillRect(0,0,64,64);
function setup(){seed=20261108;field=[];specks=[];falling=[];fallingId=0;now=0;last=0;
 const factor=clamp((W*H/(393*852))**.33,.83,1.62);
 for(const layer of layers){const n=Math.round(layer.count*factor);for(let i=0;i<n;i++)field.push(make(layer,i))}
 const count=Math.round(625*factor);for(let i=0;i<count;i++)specks.push(makeSpeck(i));
 for(let i=0;i<Math.round(5*factor);i++)falling.push(makeFalling(false));

}
function resize(){const w=Math.max(1,innerWidth|0),h=Math.max(1,innerHeight|0);if(ready&&w===W&&h===H)return;W=w;H=h;DPR=Math.min(devicePixelRatio||1,2.5);

function project(p){return{x:W*(.5+.60*p.x/p.z),y:H*(.5+.86*p.y/p.z)}};
function visible(q,size){return q.x>-size*.50&&q.x<W+size*.5&&q.y>-size*.5&&q.y<H+size*.5}
function advance(dt){const from=now;now+=dt;const forward=cameraDist(now)-cameraDist(from);
 for(let i=0;i<field.length;i++){const p=field[i];p.z-=forward*p.speed;p.x+=dt*(p.drift+.004*Math.sin(now*.36+p.phase)-(p.angled?.052:0));

 }

 }

   const p=falling[i];p.age+=dt;
   // Air drag pulls horizontal movement toward an individual prevailing wind.
   p.vx+=(p.wind-p.vx)*Math.min(1,p.air*dt);
   // Gravity accelerates the falling crystal until drag creates a soft terminal velocity.
   p.vy+=(p.gravity-p.air*.32*p.vy)*dt;
   p.x+=dt*(p.vx+.009*Math.sin(now*.53+p.phase));
   p.y+=dt*(p.vy+.005*Math.sin(now*.34+p.phase));
   p.z-=forward*p.zSpeed;
   p.angle+=dt*p.spin;
   p.pitch+=dt*.025*Math.sin(now*.32+p.phase);
   p.yaw+=dt*.026*Math.cos(now*.29+p.phase);
   const q=project(p);
   if(p.z<.48||q.x<-p.diam*.7||q.y>H+p.diam*.7||q.y<-p.diam*.7||p.age>p.life){

}
function alpha(p){
 if(p.naturalFall){
   const introduction=now<3?smooth(1.2,3.0,now)*.80:1;
   return p.alpha*smooth(0,.90,p.age)*introduction*(1-smooth(2.9,3.8,p.z))*smooth(.44,.64,p.z);
 }
 if(p.feature)return p.alpha*(1-smooth(6.0,7.4,p.z))*smooth(.34,.58,p.z);
 const zmax=p.layer.depth[1];const k=p.layer.name==='near'?3:p.layer.name==='mid'?2:1;
 const marked=((p.index*31+(p.layer.name==='mid'?3:7))%13)<k;
 // Opening controls the visually large foreground, not the ambient far-field density.
 // Temporarily suppress ordinary flakes for only the FIRST two seconds.
 // Keep all original particles, coordinates and motion intact; restore smoothly by 3.4s.
 const keepPercent=p.layer.name==='far'?74:p.layer.name==='mid'?57:43;
 const hash=(p.index*37+(p.layer.name==='far'?13:p.layer.name==='mid'?29:47))%101;
 const staging=now<3.4&&hash>=keepPercent?smooth(1.65,3.4,now):1;
 const nearOpening=p.layer.name==='near'&&now<3.15?(.25+.75*smooth(1.95,3.15,now)):1;
 const midOpening=p.layer.name==='mid'&&p.diam/p.z>105&&now<3.1?(.48+.52*smooth(1.8,3.1,now)):1;
 const intro=(marked&&now<3.45?smooth(1.75,3.45,now):1)*staging*nearOpening*midOpening;

function drawBackground(){sky.clearRect(0,0,W,H);sky.fillStyle='#e8eef3';for(const p of stars){sky.globalAlpha=p.alpha;sky.beginPath();sky.arc(p.x,p.y,p.r,0,TAU);sky.fill()}
 sky.globalAlpha=1;}
function drawSpecks(){let count=0,edge=0;for(const p of specks){const q=project(p);if(!visible(q,10))continue;
 const proximity=clamp(5.3/p.z,.6,2.4),size=clamp((p.core*.85+1.1)*proximity,1.2,8.5);

 if(a<.07)continue;ctx.globalAlpha=a;ctx.drawImage(sparkle,q.x-size*2,q.y-size*2,size*4,size*4);count++;
 if(q.x<W*.15||q.x>W*.85||q.y<H*.12||q.y>H*.88)edge++;
 }ctx.globalAlpha=1;return{count,edge};}
function drawIce(p){if(!atlas.naturalWidth||p.z<=.31)return null;const pt=project(p),size=clamp(p.diam/p.z,3,p.feature?318:236),a=alpha(p);if(a<.025||!visible(pt,size))return null;

function render(){drawBackground();ctx.clearRect(0,0,W,H);const glow=drawSpecks();const featuredNow=featured(),all=[...field,...featuredNow,...falling].sort((a,b)=>b.z-a.z);
 const counts={far:0,mid:0,near:0,feature:0},regions=Array(12).fill(0),visibleFeatures=[];let large=0;
 for(const p of all){const result=drawIce(p);if(!result)continue;

 lastStats={time:+now.toFixed(2),phase:+(now%P).toFixed(2),speed:+speed(now).toFixed(2),counts,regions,glow,large,
 diagonalField:field.filter(x=>x.angled).length,fallingCount:falling.length,visibleFeatures,atlasReady:!!atlas.naturalWidth};
}

addEventListener('resize',resize,{passive:true});document.addEventListener('visibilitychange',()=>{last=0});atlas.addEventListener('load',render);

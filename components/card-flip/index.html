<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-001 · 翻牌动效复用示例</title>
<style>
:root{color-scheme:dark;--bg:#37283f;--gold:#efc995;--pink:#dbc2da}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 40%,#755074,#382740 74%);color:#f9dfb7;font-family:"Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:26px}
.shell{width:min(96vw,670px);text-align:center}.eyebrow{font-size:14px;letter-spacing:.1em;opacity:.82}.shell h1{font-size:clamp(24px,5.8vw,38px);margin:10px 0 0}.description{font-size:13px;color:#d8c0db;line-height:1.7}.deck{position:relative;width:min(90vw,460px);height:330px;margin:18px auto;perspective:1000px}.ring{position:absolute;left:50%;top:49%;width:310px;height:310px;max-width:95%;border:1px dashed #cfb2d166;border-radius:50%;transform:translate(-50%,-50%)}.card{position:absolute;left:50%;top:8px;width:184px;height:272px;--end-x:-183px;--end-r:-12deg;transform:translateX(var(--end-x)) rotate(var(--end-r));filter:drop-shadow(0 12px 10px #1e102c55)}.card.moon{--end-x:-1px;--end-r:12deg;top:28px}.flip{position:absolute;inset:0;transform-style:preserve-3d}.front,.back{position:absolute;inset:0;backface-visibility:hidden;border:3px solid #f5d5a1;border-radius:23px;box-shadow:inset 0 0 0 6px #fff4db,inset 0 0 0 7px #cda8cd;background:#f6e8d5;color:#875c96;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:16px}.front{transform:rotateY(180deg)}.back{background:repeating-linear-gradient(45deg,#674572 0 18px,#73517e 18px 36px);color:#f8d89c;font-size:72px}.back small{font-size:15px}.portrait{display:grid;place-items:center;width:120px;height:120px;border-radius:50%;border:4px solid #d6b385;background:#d6b5df;font-size:60px}.moon .portrait{background:#b6b7eb}.front strong{font-size:25px;font-weight:400}.front small{font-size:14px}.seal{position:absolute;top:54%;left:50%;transform:translate(-50%,-50%);width:57px;height:57px;border-radius:50%;display:grid;place-items:center;background:#d4a56b;border:3px solid #fff0cd;box-shadow:0 4px 0 #75526b;color:#fff0cd;font-size:22px}.play .card{animation:deal 1.05s cubic-bezier(.18,.8,.25,1) both}.play .moon.card{animation-delay:.13s}.play .flip{animation:card-flip .85s cubic-bezier(.3,.1,.2,1) .9s both}.play .moon .flip{animation-delay:1.12s}.play .seal{animation:seal-pop .6s 1.65s both}
@keyframes deal{from{opacity:0;transform:translateX(-92px) translateY(90px) rotate(0) scale(.65)}to{opacity:1;transform:translateX(var(--end-x)) rotate(var(--end-r))}}@keyframes card-flip{to{transform:rotateY(180deg)}}@keyframes seal-pop{from{opacity:0;scale:2;rotate:-30deg}to{opacity:1;scale:1;rotate:-8deg}}
button{font:inherit;font-size:14px;border:1px solid #e2c4bf8c;border-radius:28px;color:#ffe7bd;background:#563b5f;padding:12px 22px;min-height:44px;cursor:pointer}button:focus-visible{outline:3px solid #ffe7bd}small.note{display:block;font-size:12px;color:#ddc0e0;margin-top:14px;line-height:1.8}
@media(max-width:480px){.deck{width:340px;max-width:100%;height:292px}.card{width:160px;height:245px;--end-x:-159px}.moon.card{--end-x:-1px}.portrait{width:107px;height:107px}.ring{width:285px;height:285px}.seal{width:48px;height:48px}}@media(prefers-reduced-motion:reduce){.play .card,.play .flip,.play .seal{animation-duration:.01ms!important;animation-delay:0ms!important}}
</style></head>
<body><main class="shell">
<div class="eyebrow">VESPERA CANVAS · M-001</div><h1>双卡发牌 · 翻面动画</h1>
<p class="description">原版节奏：先发两张牌，再错开翻到正面；此处头像是占位符。</p>
<div class="deck play" id="deck"><div class="ring"></div>
<div class="card pumpkin"><div class="flip"><div class="back">☾<small>One little secret</small></div><div class="front"><div class="portrait" aria-hidden="true">✦</div><strong>小南瓜</strong><small>Pumpkin witch</small></div></div></div>
<div class="card moon"><div class="flip"><div class="back">✦<small>One little secret</small></div><div class="front"><div class="portrait" aria-hidden="true">☾</div><strong>小月亮</strong><small>Moon witch</small></div></div></div>
<div class="seal">VS</div></div><button type="button" id="replay">重新播放翻牌</button>
<small class="note">源自《女巫的毒药》开场 CSS 动效；不使用原版第三方头像。<br>源文件：sources/witches-banquet/opening/opening.css</small>
</main><script>const deck=document.getElementById("deck");document.getElementById("replay").addEventListener("click",()=>{deck.classList.remove("play");void deck.offsetWidth;deck.classList.add("play")});</script></body></html>
